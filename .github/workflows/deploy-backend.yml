# CD serveur : chaque fusion dans main qui touche backend/ est testée puis déployée sur Cloudflare.
# Secrets GitHub requis : CLOUDFLARE_API_TOKEN (droits Workers Scripts + D1 en écriture), CLOUDFLARE_ACCOUNT_ID.
# Les secrets Meta restent stockés chez Cloudflare (npm run cloudflare:deploy) : ils ne passent pas par GitHub.
name: Déploiement serveur

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Cloudflare Workers + D1
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://carnet-digital-backend.fb-page-bot.workers.dev/health
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install -g npm@11.6.2  # même npm qu'en local : le lock file en dépend
      - run: npm ci
      - name: Migrations D1
        run: npx wrangler d1 migrations apply carnet-backend --remote
      - name: Déploiement du Worker
        run: npx wrangler deploy
      - name: Vérification
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS https://carnet-digital-backend.fb-page-bot.workers.dev/health; then exit 0; fi
            sleep 5
          done
          echo "Le serveur ne répond pas après le déploiement." >&2
          exit 1
