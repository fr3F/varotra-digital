name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  # Réutilisé par les pipelines de déploiement et de release avant toute mise en production.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Application (lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.6.2  # même npm qu'en local : le lock file en dépend
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  backend:
    name: Serveur (tests + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install -g npm@11.6.2  # même npm qu'en local : le lock file en dépend
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
